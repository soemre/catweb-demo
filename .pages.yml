media:
  - name: uploads
    label: Site images and files
    input: public/media
    output: /media
    categories: [image, document]
    rename: safe

components:
  rich:
    type: rich-text
    options: { format: markdown, media: uploads }
  image:
    type: image
    options: { media: uploads }
  link:
    type: string
    description: "Use a site path starting with /, an https:// address, or a mailto: link."
  action:
    type: object
    fields:
      - { name: label, label: Link text, type: string, required: true }
      - { name: url, label: Destination, component: link, required: true }
  seo:
    type: object
    description: Optional sharing title, search/sharing description and image. The browser tab always uses the page or post title.
    fields:
      - { name: title, label: Social sharing title, type: string }
      - { name: description, label: Search / sharing description, type: text }
      - { name: image, label: Sharing image, component: image }
  preview:
    type: object
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Introduction, component: rich }
      - { name: count, label: Number of previews (zero hides the section), type: number, options: { min: 0, max: 5, step: 1 } }
      - { name: action, label: Browse-all link, component: action }
  eventPreview:
    type: object
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Optional introduction, component: rich }
      - { name: count, label: Number of event boxes (zero hides the section), type: number, options: { min: 0, max: 3, step: 1 } }
      - { name: action, label: Browse-all link, component: action }
      - name: countdown
        label: Countdown labels
        type: object
        fields:
          - { name: days, label: Days, type: string }
          - { name: hours, label: Hours, type: string }
          - { name: minutes, label: Minutes, type: string }
          - { name: seconds, label: Seconds, type: string }
          - { name: label, label: "Accessible countdown sentence (retain {days}, {hours}, {minutes}, {seconds})", type: string }
  instant:
    type: date
    default: ""
    description: The picker uses YOUR DEVICE timezone. Stored with an explicit UTC offset; displayed on the site in Europe/Rome. Check your device timezone before entering an event. Empty for incomplete drafts only.
    options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssXXX" }
  slug:
    type: string
    description: Stable URL identifier. Set when creating the entry; do not change after publication without a redirect migration.
    pattern: { regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$", message: Use lowercase words separated by hyphens. }
  status:
    type: select
    default: draft
    options:
      values: [{ name: draft, label: Draft }, { name: published, label: Published }]
  resource_status:
    type: select
    default: draft
    description: Draft stays hidden; Preview shows a name and summary linking to a resource detail page with its summary/verified links, never the unfinished body; Published exposes the full resource.
    options:
      values: [{ name: draft, label: Draft (hidden) }, { name: preview, label: Preview (title and summary) }, { name: published, label: Published (full resource) }]

content:
  - name: site
    label: Site settings & interface wording
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Site / association name, type: string, required: true }
      - { name: logo, label: Optional site logo, component: image }
      - { name: logoDark, label: Optional dark-theme companion logo, component: image, description: A separate dark-background version of the site logo. Leave empty to use the main logo with a neutral backing. }
      - { name: logoAlt, label: Logo alternative text, type: string }
      - { name: description, label: Default description, type: text, required: true }
      - { name: shareImage, label: Default sharing image, component: image }
      - { name: dateLocale, label: Date display locale, type: string, description: Initially en-GB. Event times always display in Europe/Rome. }
      - name: contact
        label: Shared contact & association details
        type: object
        fields:
          - { name: email, label: Email address, type: string, required: true }
          - { name: office, label: Registered office (not a meeting venue), type: string, required: true }
          - { name: fiscalCode, label: Fiscal code, type: string, required: true }
          - { name: telegram, label: Telegram destination, component: link, required: true }
          - { name: instagram, label: Instagram destination, component: link, required: true }
          - { name: linkedin, label: LinkedIn destination, component: link, required: true }
      - name: navigation
        label: Navigation links (displayed in this order)
        type: object
        fields:
          - { name: home, label: Home, component: action }
          - { name: join, label: Join Us, component: action }
          - { name: events, label: Events, component: action }
          - { name: milestones, label: Milestones, component: action }
          - { name: news, label: News & Articles, component: action }
          - { name: resources, label: Support & Resources, component: action }
          - { name: contact, label: Contact, component: action }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: copy, label: Footer copy, component: rich }
      - name: ui
        label: Interface & empty-state text
        type: object
        fields:
          - { name: skip, label: Skip-to-content link, type: string }
          - { name: navigation, label: Navigation accessible label, type: string }
          - { name: menu, label: Mobile menu button label, type: string }
          - name: theme
            label: Theme control
            type: object
            fields:
              - { name: label, label: Control label, type: string }
              - { name: light, label: Light option, type: string }
              - { name: dark, label: Dark option, type: string }
              - { name: toggleLabel, label: "Theme toggle tooltip (retain {theme})", type: string }
              - { name: default, label: Default theme, type: select, options: { values: [light, dark, system] } }
          - name: event
            label: Event states & detail labels
            type: object
            fields:
              - { name: upcoming, label: Upcoming state, type: string }
              - { name: happening, label: Happening-now state, type: string }
              - { name: past, label: Past state, type: string }
              - { name: cancelled, label: Cancelled state, type: string }
              - { name: ended, label: Event-ended state, type: string }
              - { name: closed, label: Registration-closed state, type: string }
              - { name: opens, label: "Opening state (retain {date})", type: string }
              - { name: noRegistration, label: No-registration explanation, type: string }
              - { name: checkWithJavaScript, label: Registration explanation without JavaScript, type: text }
              - { name: homeWithoutJavaScript, label: Home events explanation without JavaScript, type: text }
              - { name: browserWithoutJavaScript, label: Browser explanation without JavaScript, type: text }
              - { name: start, label: Start date label, type: string }
              - { name: end, label: End date label, type: string }
              - { name: location, label: Location label, type: string }
              - { name: venueLink, label: Venue / online link label, type: string }
              - { name: audience, label: Audience label, type: string }
              - { name: language, label: Language label, type: string }
              - { name: cost, label: Cost label, type: string }
              - { name: accessibility, label: Accessibility label, type: string }
              - { name: registration, label: Registration heading, type: string }
              - { name: opening, label: Opening deadline label, type: string }
              - { name: closing, label: Closing deadline label, type: string }
              - { name: recap, label: Recap heading, type: string }
              - { name: gallery, label: Photos heading, type: string }
              - { name: materials, label: Materials heading, type: string }
          - name: post
            label: Post labels
            type: object
            fields:
              - { name: backHome, label: Home return link, type: string }
              - { name: backEvents, label: Events return link, type: string }
              - { name: backNews, label: News return link, type: string }
              - { name: backMilestones, label: Milestones return link, type: string }
              - { name: backResources, label: Resources return link, type: string }
              - { name: publishedOn, label: Publication date label, type: string }
              - { name: milestoneDate, label: Milestone occurrence date label, type: string }
              - { name: author, label: Author label, type: string }
          - name: resource
            label: Resource labels
            type: object
            fields:
              - { name: guide, label: Internal guide destination, type: string }
              - { name: external, label: External destination, type: string }
              - { name: official, label: Official university information, type: string }
              - { name: file, label: File destination, type: string }
              - { name: provider, label: Provider label, type: string }
              - { name: checked, label: Last-checked date label, type: string }
              - { name: preview, label: Full guide coming soon message, type: string }
          - name: empty
            label: Empty collections
            type: object
            fields:
              - { name: events, label: No upcoming Home events, type: text }
              - { name: news, label: No published news, type: text }
              - { name: resources, label: No published resources, type: text }
              - { name: supporters, label: No supporters, type: text }
              - { name: achievements, label: No verified achievements, type: text }
          - name: notFound
            label: 404 page
            type: object
            fields:
              - { name: title, label: Heading, type: string }
              - { name: body, label: Explanation, component: rich }
              - { name: action, label: Return link, component: action }

  - name: home
    label: Home page
    type: file
    path: content/pages/home.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Main headline, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: safeSpace, label: Safe-space sentence, type: text }
      - name: hero
        label: Full-width opening photo
        type: object
        fields:
          - { name: enabled, label: Show opening photo, type: boolean, default: true, description: Turn off to hide both an uploaded photo and the local seeded demo preview. }
          - { name: image, label: Photo, component: image, description: An uploaded photo takes priority over local demo artwork. With no uploaded image and no seeded demo, Home uses its text opening. }
          - { name: alt, label: Photo alternative text, type: string, description: Required when an uploaded opening photo is enabled. Describe the photo without repeating the headline. }
          - { name: focusX, label: Horizontal crop focus (%), type: number, default: 50, options: { min: 0, max: 100, step: 1 } }
          - { name: focusY, label: Vertical crop focus (%), type: number, default: 50, options: { min: 0, max: 100, step: 1 } }
      - { name: intro, label: All introductory paragraphs, component: rich }
      - { name: invitations, label: Participation invitations & links, component: rich }
      - { name: events, label: Upcoming event boxes, component: eventPreview }
      - { name: news, label: News previews, component: preview }
      - name: supporters
        label: Supporting organisations section
        type: object
        fields:
          - { name: heading, label: Accessible image-strip label (not displayed as a heading), type: string }

  - name: join
    label: Join Us page
    type: file
    path: content/pages/join.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Achievement section heading, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Achievement introduction, component: rich }
      - { name: ideas, label: Ideas & participation paragraphs, component: rich }
      - name: growth
        label: Personal development section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: body, label: All paragraphs, component: rich }
      - name: areas
        label: Internal Areas section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Introduction, component: rich }
          - { name: choice, label: Choosing now or later, component: rich }
      - name: membership
        label: Membership & joining
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Public-event invitation, component: rich }
          - { name: information, label: Membership information, component: rich }
          - { name: formUrl, label: Published Google Form responder URL, component: link, description: Use the responder link from Google Forms (not its editor URL). Leave empty to show the shared-email fallback. }
          - { name: formLabel, label: Form link text, type: string }
          - { name: events, label: Events invitation link, component: action }
          - { name: emailLabel, label: Email fallback text, type: string }
          - { name: eligibility, label: Eligibility (when confirmed), component: rich }
          - { name: eligibilityLabel, label: Eligibility heading, type: string }
          - { name: fee, label: Fee (when confirmed), component: rich }
          - { name: feeLabel, label: Fee heading, type: string }
          - { name: duration, label: Duration (when confirmed), component: rich }
          - { name: durationLabel, label: Duration heading, type: string }
          - { name: approval, label: Approval process (when confirmed), component: rich }
          - { name: approvalLabel, label: Process heading, type: string }
          - { name: questions, label: Questions invitation, type: text }
          - { name: contact, label: Contact link, component: action }

  - name: eventsPage
    label: Events calendar & agenda
    type: file
    path: content/pages/events.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Accessible page heading, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Metadata fallback description (not shown above the calendar), component: rich }
      - name: controls
        label: Browser labels
        type: object
        fields:
          - { name: agenda, label: Agenda heading, type: string }
          - { name: backCalendar, label: Small-screen return-to-calendar link, type: string }
          - { name: previous, label: Previous month button, type: string }
          - { name: next, label: Next month button, type: string }
          - { name: today, label: Today button, type: string }
          - { name: month, label: Calendar month accessible label, type: string }
          - { name: selectDay, label: "Select date label (retain {date})", type: string }
          - { name: moreEvents, label: "Extra events label (retain {count})", type: string }
          - { name: selectedDay, label: "Date selection announcement (retain {date} and {count})", type: string }
      - name: empty
        label: Browser empty states
        type: object
        fields:
          - { name: all, label: All events empty, type: text }
          - { name: month, label: Current month empty, type: text }
          - { name: day, label: No events on selected date, type: text }

  - name: milestonesPage
    label: Milestones page & timeline
    type: file
    path: content/pages/milestones.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Introduction, component: rich }
      - { name: timelineHeading, label: Timeline heading, type: string }
      - { name: learnMore, label: Hover / keyboard-focus tooltip, type: string }
      - { name: empty, label: Empty timeline message, type: text }

  - name: newsPage
    label: News & Articles page
    type: file
    path: content/pages/news.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Introduction, component: rich }
      - { name: listingHeading, label: Listing heading, type: string }
      - name: controls
        label: Reader & photo controls
        type: object
        fields:
          - { name: previousPhoto, label: Previous photo, type: string }
          - { name: nextPhoto, label: Next photo, type: string }
          - { name: photoPosition, label: "Photo position (retain {current} and {total})", type: string }
          - { name: loading, label: Loading article, type: string }
          - { name: loaded, label: "Selected article announcement (retain {title})", type: string }
      - name: categories
        label: Public category labels
        type: object
        fields:
          - { name: news, label: News, type: string }
          - { name: article, label: Article, type: string }
          - { name: announcement, label: Announcement, type: string }
          - { name: milestone, label: Milestone, type: string }

  - name: resourcesPage
    label: Support & Resources page
    type: file
    path: content/pages/resources.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Introduction, component: rich }
      - { name: invitation, label: Contact invitation & link, component: rich }

  - name: contactPage
    label: Contact page
    type: file
    path: content/pages/contact.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: headline, label: Headline, type: string }
      - { name: seo, label: Metadata, component: seo }
      - { name: intro, label: Introduction, component: rich }
      - { name: detailsHeading, label: Association details heading, type: string }
      - name: labels
        label: Contact labels (destinations are in Site settings)
        type: object
        fields:
          - { name: telegram, label: Telegram link text, type: string }
          - { name: instagram, label: Instagram link text, type: string }
          - { name: linkedin, label: LinkedIn link text, type: string }
          - { name: office, label: Registered office label, type: string }
          - { name: fiscalCode, label: Fiscal code label, type: string }

  - name: areas
    label: Internal Areas
    type: collection
    path: content/areas
    format: json
    filename: { template: "{primary}.json", field: create }
    view: { primary: name, sort: order, order: asc }
    fields:
      - { name: name, label: Area name, type: string, required: true }
      - { name: description, label: Description & responsibilities, component: rich }
      - { name: contribute, label: How members can contribute, component: rich }
      - { name: order, label: Display order (lowest first), type: number, required: true }
      - { name: visible, label: Show publicly, type: boolean, default: true }

  - name: achievements
    label: Achievements & milestone verification
    type: collection
    path: content/achievements
    format: json
    filename: { template: "{primary}.json", field: create }
    view: { primary: text, sort: order, order: asc }
    fields:
      - { name: text, label: Achievement text, component: rich, required: true }
      - { name: order, label: Display order, type: number, required: true }
      - { name: published, label: Publish (also requires confirmed verification), type: boolean, default: false }
      - { name: verification, label: Verification state, type: select, default: pending, options: { values: [pending, confirmed, rejected] } }
      - { name: editorNotes, label: Editorial notes (not shown on the site), type: text }

  - name: events
    label: Event posts
    type: collection
    path: content/events
    format: yaml-frontmatter
    filename: { template: "{fields.slug}.md", field: create }
    view: { primary: title, fields: [title, status, start], sort: start, order: desc }
    fields:
      - { name: title, label: Event title, type: string }
      - { name: slug, label: Stable URL slug, component: slug }
      - { name: status, label: Publication, component: status }
      - { name: summary, label: Preview summary, type: text }
      - { name: body, label: Full event post / programme, component: rich }
      - { name: seo, label: Metadata, component: seo }
      - { name: image, label: Optional cover, component: image }
      - { name: imageAlt, label: Cover alternative text, type: string }
      - { name: sticker, label: Optional sticker, component: image, description: Separate from photos. Upload a transparent PNG/WebP or SVG for an irregular cutout. The linked title labels this decorative artwork. }
      - { name: calendarImage, label: Previous calendar sticker (compatible fallback), component: image, description: Existing artwork is still used when Sticker is empty. If both are empty the cover is used. }
      - { name: start, label: Start date & time, component: instant }
      - { name: end, label: End date & time, component: instant }
      - { name: location, label: Event location, type: string }
      - { name: venueUrl, label: Online / venue URL, component: link }
      - { name: audience, label: Who can attend, component: rich }
      - { name: language, label: Event language, type: string }
      - { name: cost, label: Cost (only when supplied), type: string }
      - { name: accessibility, label: Accessibility information, component: rich }
      - { name: attendance, label: How to attend / no-registration instructions, component: rich }
      - { name: registrationRequired, label: Registration required, type: boolean, default: false }
      - { name: registrationOpens, label: Optional registration opening, component: instant }
      - { name: registrationCloses, label: Registration closing deadline, component: instant, description: Required for published events needing registration; must not be after event end. The external form must enforce this deadline too. }
      - { name: registrationUrl, label: External registration form URL, component: link }
      - { name: registrationLabel, label: Register / join button text, type: string, default: Register }
      - { name: manuallyClosed, label: Close registration manually, type: boolean, default: false }
      - { name: cancelled, label: Event cancelled, type: boolean, default: false }
      - { name: cancellationNotice, label: Cancellation notice, component: rich }
      - { name: recap, label: Recap (edit the original post after the event), component: rich }
      - name: gallery
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, component: image }
          - { name: alt, label: Alternative text, type: string }
          - { name: caption, label: Caption, type: text }
      - name: materials
        label: Materials & links
        type: object
        list: true
        fields:
          - { name: title, label: Link text, type: string }
          - { name: url, label: Destination, component: link }

  - name: news
    label: News, article & milestone posts
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: { template: "{fields.slug}.md", field: create }
    view: { primary: title, fields: [title, status, category, date], sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: Stable URL slug, component: slug }
      - { name: status, label: Publication, component: status }
      - { name: summary, label: Preview summary, type: text }
      - { name: body, label: Full post, component: rich }
      - { name: category, label: Category, type: select, default: news, options: { values: [news, article, announcement, milestone] } }
      - { name: date, label: Publication date, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: milestoneDate, label: Milestone date (when it happened), type: date, default: "", description: Required for published Milestone posts. Controls the date and newest-first order on the Milestones timeline; the publication date still controls News and Home previews., options: { format: yyyy-MM-dd } }
      - { name: author, label: Optional author, type: string }
      - { name: image, label: Optional cover, component: image }
      - { name: imageAlt, label: Cover alternative text, type: string }
      - { name: sticker, label: Optional sticker, component: image, description: Separate from photos. Upload a transparent PNG/WebP or SVG for an irregular cutout in the news list and beside milestone circles. The linked title labels this decorative artwork. }
      - name: gallery
        label: Additional photos (after the cover)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, component: image }
          - { name: alt, label: Alternative text, type: string }
          - { name: caption, label: Caption, type: text }
      - { name: seo, label: Metadata, component: seo }

  - name: resources
    label: Resource previews, guides & links (flat list)
    type: collection
    path: content/resources
    format: yaml-frontmatter
    filename: { template: "{fields.slug}.md", field: create }
    view: { primary: title, fields: [title, status, kind, order], sort: order, order: asc }
    fields:
      - { name: title, label: Title, type: string }
      - { name: slug, label: Stable URL slug, component: slug }
      - { name: status, label: Publication, component: resource_status }
      - { name: summary, label: Summary, type: text }
      - { name: body, label: Full internal guide / additional description, component: rich }
      - { name: kind, label: Destination type, type: select, default: guide, options: { values: [guide, external, file] } }
      - { name: order, label: Display order (lowest first), type: number, default: 0 }
      - { name: provider, label: Provider, type: string }
      - { name: url, label: External resource URL, component: link }
      - { name: file, label: Linked file, type: file, options: { media: uploads } }
      - { name: checked, label: Last checked, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: editorNotes, label: Editorial notes (not shown on the site), type: text }
      - { name: image, label: Optional image, component: image }
      - { name: imageAlt, label: Image alternative text, type: string }
      - { name: seo, label: Metadata, component: seo }

  - name: supporters
    label: Supporting organisations
    type: collection
    path: content/supporters
    format: json
    filename: { template: "{primary}.json", field: create }
    view: { primary: name, sort: order, order: asc }
    fields:
      - { name: name, label: Organisation name, type: string, required: true }
      - { name: website, label: Image click destination, component: link, required: true }
      - { name: logo, label: Image for Home strip, component: image, description: Upload an image to appear in the image-only Home strip. Visible entries without an image are omitted. }
      - { name: logoAlt, label: Image alternative text (defaults to organisation name), type: string }
      - { name: relationship, label: Relationship notes (not displayed on Home), component: rich }
      - { name: order, label: Display order, type: number, required: true }
      - { name: visible, label: Show publicly, type: boolean, default: false }
